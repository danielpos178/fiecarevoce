name: Optimize Post Images

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'static/images/posts/**'
  pull_request:
    paths:
      - 'static/images/posts/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize:
    name: Compress & Convert Post Images to WebP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Convert and Downscale Post Images to WebP (90% Quality)
        run: |
          python3 -c "import textwrap; exec(textwrap.dedent('''
          import os
          from PIL import Image, ImageOps

          target_dir = 'static/images/posts'
          max_w, max_h = 1920, 1080
          quality = 90
          valid_exts = ('.jpg', '.jpeg', '.png', '.webp', '.bmp', '.tiff')

          if os.path.exists(target_dir):
              for root, _, files in os.walk(target_dir):
                  for file in files:
                      ext = os.path.splitext(file)[1].lower()
                      if ext in valid_exts:
                          fpath = os.path.join(root, file)
                          try:
                              with Image.open(fpath) as img:
                                  img = ImageOps.exif_transpose(img)
                                  w, h = img.size

                                  if w > max_w or h > max_h:
                                      ratio = min(max_w / float(w), max_h / float(h))
                                      new_w = int(round(w * ratio))
                                      new_h = int(round(h * ratio))
                                      img = img.resize((new_w, new_h), Image.Resampling.LANCZOS)
                                      print(f'Resized {file}: {w}x{h} -> {new_w}x{new_h}')

                                  if img.mode in ('RGBA', 'LA') or (img.mode == 'P' and 'transparency' in img.info):
                                      img = img.convert('RGBA')
                                  else:
                                      img = img.convert('RGB')

                                  base_path = os.path.splitext(fpath)[0]
                                  webp_path = base_path + '.webp'

                                  img.save(webp_path, 'WEBP', quality=quality, method=6)
                                  print(f'Saved WebP for {file} @ {quality}% quality -> {webp_path}')

                              if ext != '.webp':
                                  os.remove(fpath)
                                  print(f'Removed original non-WebP file: {fpath}')

                          except Exception as e:
                              print(f'Error processing {file}: {e}')
          '''))"

      - name: Commit & Push Processed WebP Images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): convert post images to webp (90% quality, max 1920x1080) [skip ci]"
          file_pattern: 'static/images/posts/**'


