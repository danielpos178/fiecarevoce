name: Optimize Images

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'static/images/**'
      - 'assets/images/**'
  pull_request:
    paths:
      - 'static/images/**'
      - 'assets/images/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize:
    name: Compress & Optimize Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Run Image Compression Script
        run: |
          python3 -c "
          import os
          from PIL import Image, ImageOps

          target_dirs = ['static/images', 'assets/images']
          max_dim = 1600
          quality = 82

          for d in target_dirs:
              if not os.path.exists(d):
                  continue
              for root, _, files in os.walk(d):
                  for file in files:
                      ext = os.path.splitext(file)[1].lower()
                      if ext in ['.jpg', '.jpeg', '.png', '.webp']:
                          fpath = os.path.join(root, file)
                          size_before = os.path.getsize(fpath)
                          if size_before < 10000:
                              continue
                          try:
                              with Image.open(fpath) as img:
                                  img = ImageOps.exif_transpose(img)
                                  w, h = img.size
                                  if max(w, h) > max_dim:
                                      ratio = max_dim / float(max(w, h))
                                      img = img.resize((int(w * ratio), int(h * ratio)), Image.Resampling.LANCZOS)
                                  if ext in ['.jpg', '.jpeg']:
                                      if img.mode != 'RGB':
                                          img = img.convert('RGB')
                                      img.save(fpath, 'JPEG', quality=quality, optimize=True)
                                  elif ext == '.png':
                                      if img.mode != 'RGBA':
                                          img = img.convert('RGB')
                                      img.save(fpath, 'PNG', optimize=True)
                                  elif ext == '.webp':
                                      img.save(fpath, 'WEBP', quality=quality, method=6)
                                  size_after = os.path.getsize(fpath)
                                  saved = size_before - size_after
                                  if saved > 0:
                                      print(f'Optimized {file}: {size_before//1024}KB -> {size_after//1024}KB (Saved {saved//1024}KB)')
                          except Exception as e:
                              print(f'Error optimizing {file}: {e}')
          "

      - name: Commit & Push Optimized Images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): auto-compress and optimize images [skip ci]"
          file_pattern: 'static/images/* assets/images/*'
