name: Lighthouse Audit

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs on the same PR to avoid redundant audits
concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # Needed to post audit results as a PR comment

jobs:
  lighthouse:
    name: Performance & Accessibility Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # ── 2. Build ──────────────────────────────────────────────────────────
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build site
        run: hugo --minify --gc
        env:
          HUGO_ENVIRONMENT: production

      # ── 3. Serve ──────────────────────────────────────────────────────────
      - name: Install serve
        run: npm install -g serve

      - name: Start local server
        run: serve -l 4000 public &
        # Port 4000 avoids conflicts with common dev tools

      - name: Wait for server to be ready
        run: |
          echo "Waiting for local server..."
          for i in {1..10}; do
            curl -sf http://localhost:4000 > /dev/null && echo "Server ready." && break
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
          done

      # ── 4. Audit ──────────────────────────────────────────────────────────
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        id: lighthouse
        with:
          urls: |
            http://localhost:4000/
            http://localhost:4000/categories/
          # Thresholds — fail the job if scores drop below these values.
          # Adjust to match your team's quality bar.
          budgetPath: .github/lighthouse/budget.json
          uploadArtifacts: true   # Store raw LHCI reports as workflow artifacts
          temporaryPublicStorage: false
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # ── 5. Comment ────────────────────────────────────────────────────────
      - name: Post Lighthouse results to PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const results = ${{ steps.lighthouse.outputs.manifest }};
            if (!results || results.length === 0) {
              console.log("No Lighthouse results found.");
              return;
            }

            const formatScore = (score) => {
              const pct = Math.round(score * 100);
              const icon = pct >= 90 ? "🟢" : pct >= 50 ? "🟡" : "🔴";
              return `${icon} ${pct}`;
            };

            const rows = results.map((r) => {
              const s = r.summary;
              const url = r.url.replace("http://localhost:4000", "");
              return `| \`${url || "/"}\` | ${formatScore(s.performance)} | ${formatScore(s.accessibility)} | ${formatScore(s["best-practices"])} | ${formatScore(s.seo)} |`;
            });

            const body = [
              "## 🔦 Lighthouse Audit Results",
              "",
              "| URL | Performance | Accessibility | Best Practices | SEO |",
              "| --- | :---------: | :-----------: | :------------: | :-: |",
              ...rows,
              "",
              "> 🟢 ≥ 90 &nbsp;|&nbsp; 🟡 50–89 &nbsp;|&nbsp; 🔴 < 50",
              "",
              `<sub>Audited at commit ${context.sha.slice(0, 7)} — [Full reports](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})</sub>`,
            ].join("\n");

            // Update existing bot comment if present, otherwise create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) =>
                c.user.type === "Bot" &&
                c.body.includes("🔦 Lighthouse Audit Results")
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
