colorScheme = "custom"
defaultAppearance = "light"
autoSwitchAppearance = true
showAppearanceSwitcher = true
enableSearch = false
enableCodeCopy = true
robots = "index, follow"
siteSubtitle = "Platformă Independentă a Elevilor din România"
description = "Fiecare Voce este o platformă independentă care susține și publică opiniile elevilor, fără filtre, și aduce în atenție problemele care afectează educația românească."
keywords = ["Fiecare Voce", "blog elevi", "educatie Romania", "drepturile elevilor", "burse scolare", "ONG tineret", "voluntariat", "lideri comunitari", "advocacy", "jurnalism elevi", "opinii elevi"]
defaultSocialImage = "images/og-logo.webp"
images = ["images/og-logo.webp"]

[author]
  name = "Fiecare Voce"
  email = "fiecarevoce@gmail.com"
  links = [
    { instagram = "https://www.instagram.com/fiecarevoce" },
    { tiktok = "https://www.tiktok.com/@fiecarevoce" }
  ]

[header]
  layout = "flex"
  showTitle = false
  showLogo = true
  logo = "images/logo1000.webp"
  disableTextInHeader = true

[footer]
  showCopyright = true
  showThemeAttribution = false

[homepage]
  layout = "custom"
  showRecent = true
  showRecentItems = 3

[seo]
  metaDescriptionOrder = ["description", "summary", "site"]

[sitemap]
  excludedKinds = ["taxonomy", "term"]

