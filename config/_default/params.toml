colorScheme = "custom"
defaultAppearance = "light"
autoSwitchAppearance = false
showAppearanceSwitcher = false
enableSearch = true
enableCodeCopy = true
description = "Fiecare Voce este o asociație non-profit dedicată tinerilor între 12 și 25 de ani pentru dezvoltare comunitară, educație civică, sustenabilitate și inițiative sociale."
keywords = ["ONG", "tineret", "voluntariat", "lideri comunitari", "advocacy", "sustenabilitate", "schimbare sociala"]
defaultSocialImage = "images/logo1000.webp"

[author]
  name = "Fiecare Voce"
  email = "contact@fiecarevoce.com"

[header]
  layout = "flex"
  showTitle = false
  showLogo = true
  logo = "images/logo1000.webp"
  disableTextInHeader = true

[footer]
  showCopyright = true
  showThemeAttribution = false

[homepage]
  layout = "custom"
  showRecent = true
  showRecentItems = 3

[seo]
  metaDescriptionOrder = ["summary", "description", "site"]

[sitemap]
  excludedKinds = ["taxonomy", "term"]
