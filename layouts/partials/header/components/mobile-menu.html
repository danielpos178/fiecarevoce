<div class="flex items-center gap-3">
  
  <!-- Theme Appearance Switcher for Mobile -->
  {{ if .Site.Params.showAppearanceSwitcher | default true }}
  <button
    id="appearance-switcher-mobile"
    type="button"
    aria-label="Toggle theme"
    class="p-2 border-2 border-neutral-900 dark:border-neutral-100 bg-white dark:bg-neutral-900 text-neutral-900 dark:text-white sticker-shadow hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors cursor-pointer flex items-center justify-center"
    title="Comută modul întunecat/luminos">
    <span class="dark:hidden flex items-center justify-center">
      <span class="material-symbols-outlined text-lg">dark_mode</span>
    </span>
    <span class="hidden dark:flex items-center justify-center text-brand-gold">
      <span class="material-symbols-outlined text-lg">light_mode</span>
    </span>
  </button>
  {{ end }}

  <!-- Mobile Hamburger Menu Button -->
  <input type="checkbox" id="mobile-menu-toggle" autocomplete="off" class="hidden peer">
  <label for="mobile-menu-toggle" class="p-2 border-2 border-neutral-900 dark:border-neutral-100 bg-brand-gold text-slate-900 sticker-shadow cursor-pointer flex items-center justify-center select-none" aria-label="Deschide Meniul">
    <span class="material-symbols-outlined text-2xl font-bold">menu</span>
  </label>

  <!-- Fullscreen Neo-Brutalist Mobile Menu Drawer -->
  <div role="dialog" aria-modal="true" class="fixed inset-0 z-50 invisible opacity-0 transition-all duration-300 peer-checked:visible peer-checked:opacity-100 bg-neutral-50 dark:bg-[#121212] flex flex-col justify-between p-6 sm:p-10 font-zine-body">
    
    <!-- Drawer Top Header Bar -->
    <div class="flex items-center justify-between border-b-2 border-neutral-900 dark:border-neutral-700 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-brand-green border-2 border-neutral-900 dark:border-neutral-100 flex items-center justify-center sticker-shadow shrink-0 p-1">
          <img src="{{ "images/logo1000.webp" | relURL }}" alt="Logo" class="w-full h-full object-contain filter brightness-0 invert nozoom">
        </div>
        <span class="font-display font-black text-xl uppercase tracking-tight text-neutral-900 dark:text-white">
          FIECARE VOCE
        </span>
      </div>

      <label for="mobile-menu-toggle" class="p-2 border-2 border-neutral-900 dark:border-neutral-100 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white sticker-shadow cursor-pointer flex items-center justify-center" aria-label="Închide Meniul">
        <span class="material-symbols-outlined text-2xl">close</span>
      </label>
    </div>

    <!-- Navigation Links List -->
    <nav class="flex flex-col gap-6 py-8 my-auto font-display font-black text-2xl sm:text-3xl uppercase">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}" onclick="document.getElementById('mobile-menu-toggle').checked = false;" class="text-neutral-900 dark:text-white hover:text-brand-green dark:hover:text-brand-gold flex items-center justify-between border-b-2 border-neutral-200 dark:border-neutral-800 pb-3 transition-colors">
          <span>{{ .Name }}</span>
          <span class="material-symbols-outlined text-xl">arrow_forward</span>
        </a>
      {{ end }}
    </nav>

    <!-- Mobile Drawer Footer CTA -->
    <div class="flex flex-col gap-4 border-t-2 border-neutral-900 dark:border-neutral-700 pt-6">
      <a href="{{ "/#implica-te" | relURL }}" onclick="document.getElementById('mobile-menu-toggle').checked = false;" class="w-full bg-brand-gold text-slate-900 border-2 border-neutral-900 py-4 font-label text-sm uppercase font-black sticker-shadow sticker-shadow-hover text-center flex items-center justify-center gap-2 transition-all">
        <span>ALĂTURĂ-TE CAUZEI</span>
        <span class="material-symbols-outlined text-base">arrow_forward</span>
      </a>

      <div class="font-label text-xs uppercase text-neutral-500 dark:text-neutral-400 text-center pt-2">
        © {{ now.Year }} FIECARE VOCE INDEPENDENT PRESS
      </div>
    </div>

  </div>

</div>
