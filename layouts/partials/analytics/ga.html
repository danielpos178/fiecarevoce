{{/* Google Consent Mode v2 & Google Analytics 4 Integration */}}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // 1. Verificare stare consimțământ stocată anterior
  var fvStoredConsent = 'denied';
  try {
    if (localStorage.getItem('fv_cookie_consent') === 'granted') {
      fvStoredConsent = 'granted';
    }
  } catch (e) {}

  // 2. Configurare Google Consent Mode v2 (implicit 'denied' conform GDPR)
  gtag('consent', 'default', {
    'analytics_storage': fvStoredConsent,
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'wait_for_update': 500
  });

  gtag('js', new Date());
  gtag('config', '{{ site.Config.Services.GoogleAnalytics.ID }}', {
    'anonymize_ip': true
  });
</script>
<script
  async
  src="https://www.googletagmanager.com/gtag/js?id={{ site.Config.Services.GoogleAnalytics.ID }}"></script>
