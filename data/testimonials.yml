section_title: "Vocile Tinerilor Voluntari"
section_subtitle: "Povești reale de la membrii comunității Fiecare Voce."
testimonials:
  - quote: "„Fiecare Voce a însemnat o provocare nouă, o redescoperire personală și o deschidere către un nou univers: cel al tinerilor pasionați de scris și de tot ce se întâmplă în lume. N-a fost nevoie de multe ca să mă conving că e mediul potrivit. Doar puțină energie bună, libertate de exprimare, încredere și muncă în echipă. 💚”"
    author: "Dumitrachi Irina-Gabriela"
    role: "Membră Fiecare Voce"
    initials: "DI"
  - quote: "„Să aduc contribuția mea în echipa Fiecare Voce a fost o experiență minunată. Am simțit că acest proiect oferă tinerilor oportunitatea de a se face remarcați și de a-și susține ideile. În echipa Fiecare Voce e despre oameni, susținere și valori.”"
    author: "Draca Alessia"
    role: "Membră Fiecare Voce"
    initials: "DA"
  - quote: "„Urmăresc de la început echipa Fiecare Voce, iar la începutul verii m-am alăturat și eu. Este o comunitate deschisă, în care chiar fiecare voce este auzită. :) Acest proiect m-a ajutat să împărtășesc oamenilor pasiunea mea de travel și viziunea în politică.”"
    author: "Jurca Ana"
    role: "Membră Fiecare Voce"
    initials: "JA"
  - quote: "„FiecareVoce a devenit mai mult decât un proiect — a devenit o familie. Aici mi-am descoperit talente noi și pasiuni noi. Cel mai important, la FiecareVoce am avut libertatea de a-mi exprima opinia, și pe lângă faptul că am fost citită, am fost ascultată și înțeleasă.”"
    author: "Duca Maria"
    role: "Redactor Fiecare Voce"
    initials: "DM"
