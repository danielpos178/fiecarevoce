section_title: "Vocile Tinerilor Voluntari"
section_subtitle: "Povești reale de la membrii comunității Fiecare Voce."
testimonials:
  - quote: "Fiecare Voce mi-a oferit încrederea de a lansa primul meu proiect ecologic în liceu. Am realizat că vârsta nu este o barieră în cale."
    author: "Alexia Popa"
    role: "Voluntar (17 ani)"
    location: "Cluj-Napoca"
  - quote: "Aici am găsit o echipă motivată de tineri care cred cu adevărat în schimbare. Fiecare atelier de leadership mi-a deschis noi perspective."
    author: "Matei Ionescu"
    role: "Coordonator Proiecte (21 ani)"
    location: "București"
  - quote: "Programele de mentorat sunt incredibile. Este locul unde ideile îndrăznețe ale tinerilor primesc suportul necesar pentru a deveni realitate."
    author: "Elena Radu"
    role: "Lider Civic (19 ani)"
    location: "Timișoara"
