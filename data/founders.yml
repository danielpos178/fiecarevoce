title: "Echipa"
subtitle: "În spatele Fiecare Voce se află o echipă de elevi din toată România, fiecare venind cu propriile idei, experiențe și moduri de a vedea lucrurile. Ne ocupăm de tot ceea ce face platforma să meargă mai departe, de la coordonare și comunicare până la articole și proiecte."
items:
  - name: "Luca Georgescu"
    role: "Co-Fondator"
    image: "/images/echipa/luca-georgescu.jpg"
    image_position: "50% 25%"
    bio: "Bună! Sunt Luca, elev în clasa a X-a și unul dintre cei doi co-fondatori ai proiectului. Sunt pasionat de educația din România și încerc, alături de echipa Fiecare Voce, să avem un impact cu adevărat real, punând presiune și exprimându-ne dezacordul față de propunerile Ministerului care afectează elevii și, în general, mediul preuniversitar. Sunt și o persoană foarte STEM oriented, fiind pasionat în special de AI și Tech și încercând să construiesc proiecte la intersecția dintre Inteligența Artificială și educație."
    achievements_title: "Realizări & Activități"
    achievements:
      - "Bronz la Olimpiada Națională de Informatică"
      - "Bronz la Olimpiada Națională de Inteligență Artificială (ONIA)"
      - "Membru The Rory Bookshelf"
      - "Membru în Consiliul Național al Elevilor (CNE)"
  - name: "Iulia Geambazu"
    role: "Co-Fondator"
    image: "/images/echipa/iulia-geambazu.jpg"
    image_position: "50% 25%"
    bio: "Bună! Sunt Geambazu Iulia, co-fondatoare a proiectului Fiecare Voce. De-a lungul anilor am participat la diverse olimpiade și concursuri școlare, iar implicarea în activități extrașcolare a fost mereu o parte importantă din parcursul meu. Anul acesta voi începe studiile la École Polytechnique, în Franța, și doresc să lucrez în continuare la dezvoltarea proiectului. Prin Fiecare Voce, am creat un spațiu în care elevii își pot exprima liber opiniile despre teme precum educație, istorie sau politică. Alături de Luca, am construit un mediu în care fiecare tânăr își poate descoperi și face auzită propria voce."
    achievements_title: "Realizări & Activități"
    achievements:
      - "Acceptată la École Polytechnique Paris — Science Bachelors"
      - "Lucrează la o platformă dedicată copiilor cu autism"
      - "Bronz la faza finală a concursului Upper School (Matematică)"
      - "Multiple etape naționale la Olimpiada Națională de Matematică"
  - name: "Briana Bucur"
    role: "Coordonator Principal"
    image: "/images/echipa/briana-bucur.jpg"
    image_position: "35% 35%"
    bio: "Bună! Sunt Briana, am 16 ani și sunt o persoană organizată, responsabilă și deschisă. Îmi place să mă implic în lucrurile care mă pasionează și să cunosc oameni noi. Se ocupă de activitatea de zi cu zi a platformei și ajută ideile și deciziile noastre să prindă contur și să ajungă, la propriu, să fie puse în practică."
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Coordonarea activității de zi cu zi"
      - "Implementarea deciziilor platformei"
  - name: "Teodora Costache"
    role: "Secretar"
    image: "/images/echipa/teodora-costache.jpg"
    image_position: "50% 25%"
    bio: "Este persoana care ține lucrurile organizate: de la întâlniri și minute până la documentele care circulă în interiorul și în afara platformei."
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Organizarea documentelor și minutelor"
      - "Gestionarea fluxului de informații"
  - name: "Alesia Diniță"
    role: "Director de PR"
    image: "/images/echipa/alesia-dinita.jpg"
    bio: "Bună! Sunt Alesia, elevă în clasa a XI-a și Director de PR al platformei Fiecare Voce. Sunt o persoană comunicativă, creativă și mereu dornică să transform ideile în ceva vizual și memorabil. Designul grafic este una dintre cele mai mari pasiuni ale mele, pe care o dezvolt prin implicarea în diferite asociații și proiecte. Îmi place să lucrez cu oamenii, să comunic și, bineînțeles, să aduc puțin roz oriunde merg. 💗"
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Gestionarea imaginii externe a platformei"
      - "Relații cu instituții și mass-media"
      - "Colaborare cu echipa de social media"
  - name: "Eva Chelba"
    role: "Coordonator de activitate al membrilor"
    image: "/images/echipa/eva-chelba.jpg"
    image_position: "50% 25%"
    bio: "Ține aproape de membrii echipei, urmărește implicarea lor și ajută la împărțirea activităților astfel încât fiecare să își poată găsi locul și să contribuie cât mai bine."
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Urmărirea implicării membrilor"
      - "Împărțirea activităților în echipă"
