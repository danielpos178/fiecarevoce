title: "Echipa"
subtitle: "În spatele Fiecare Voce se află o echipă de elevi din toată România, fiecare venind cu propriile idei, experiențe și moduri de a vedea lucrurile. Ne ocupăm de tot ceea ce face platforma să meargă mai departe, de la coordonare și comunicare până la articole și proiecte."
items:
  - name: "Luca Georgescu"
    role: "Președinte"
    image: "/images/echipa/luca-georgescu.jpg"
    image_position: "50% 25%"
    bio: "Bună! Sunt Luca, elev în clasa a X-a și Președinte al proiectului Fiecare Voce. Sunt pasionat de educația din România și încerc, alături de echipa Fiecare Voce, să avem un impact cu adevărat real, punând presiune și exprimându-ne dezacordul față de propunerile Ministerului care afectează elevii și, în general, mediul preuniversitar. Sunt și o persoană foarte STEM oriented, fiind pasionat în special de AI și Tech și încercând să construiesc proiecte la intersecția dintre Inteligența Artificială și educație."
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Definirea viziunii și valorilor platformei"
      - "Coordonarea direcției strategice"
      - "Reprezentarea „Fiecare Voce” în relația cu instituțiile, partenerii și presa"
      - "Asigurarea respectării misiunii proiectului și avizarea pozițiilor publice"
  - name: "Iulia Geambazu"
    role: "Co-Fondator"
    image: "/images/echipa/iulia-geambazu.jpg"
    image_position: "50% 25%"
    bio: "Bună! Sunt Geambazu Iulia, co-fondatoare a proiectului Fiecare Voce. De-a lungul anilor am participat la diverse olimpiade și concursuri școlare, iar implicarea în activități extrașcolare a fost mereu o parte importantă din parcursul meu. Anul acesta voi începe studiile la École Polytechnique, în Franța, și doresc să lucrez în continuare la dezvoltarea proiectului. Prin Fiecare Voce, am creat un spațiu în care elevii își pot exprima liber opiniile despre teme precum educație, istorie sau politică. Alături de Luca, am construit un mediu în care fiecare tânăr își poate descoperi și face auzită propria voce."
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Definirea viziunii și valorilor platformei"
      - "Coordonarea direcției strategice"
      - "Reprezentarea „Fiecare Voce” în relația cu instituțiile, partenerii și presa"
      - "Asigurarea respectării misiunii proiectului și avizarea pozițiilor publice"
  - name: "Alesia Diniță"
    role: "Vicepreședinte PR și Social Media"
    image: "/images/echipa/alesia-dinita.jpg"
    bio: "Se ocupă de imaginea și promovarea platformei, coordonând relația cu Echipa de Social Media. Elaborează strategia de comunicare și calendarul de postări, dezvoltă idei de promovare și gestionează relația cu presa și alte organizații pe partea de comunicare."
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Elaborarea strategiei de comunicare și a calendarului de postări"
      - "Coordonarea relației cu Echipa de Social Media"
      - "Dezvoltarea ideilor de promovare a platformei"
      - "Gestionarea relațiilor cu presa și alte organizații"
  - name: "Eva Chelba"
    role: "Vicepreședinte Recrutare, Evenimente și Monitorizare"
    image: "/images/echipa/eva-chelba.jpg"
    image_position: "50% 25%"
    bio: "Se ocupă de recrutarea și implicarea membrilor, precum și de organizarea evenimentelor platformei. Coordonează procesele de selecție, colectează feedback, monitorizează activitatea membrilor și semnalează eventualele probleme sau cazuri de inactivitate către Secretariat."
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Coordonarea proceselor de selecție și recrutare"
      - "Organizarea evenimentelor platformei"
      - "Monitorizarea implicării membrilor și colectarea de feedback"
      - "Semnalarea problemelor de activitate către Secretariat"
  - name: "Maria Sbîrneciu"
    role: "Vicepreședinte Research și Politici Educaționale"
    image: "/images/echipa/maria-sbirneciu.jpg"
    image_position: "50% 20%"
    bio: "Se ocupă de cercetarea și analiza problemelor din educație, coordonând Departamentul de Research. Identifică subiecte relevante pentru elevi, documentează și verifică informațiile, iar împreună cu Președintele contribuie la formularea pozițiilor publice ale platformei și la stabilirea direcțiilor de conținut."
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Coordonarea Departamentului de Research"
      - "Cercetarea și analiza problemelor din sistemul educațional"
      - "Documentarea și verificarea informațiilor"
      - "Contribuție la pozițiile publice și direcțiile de conținut alături de Președinte"
  - name: "Teodora Costache"
    role: "Secretar"
    image: "/images/echipa/teodora-costache.jpg"
    image_position: "50% 25%"
    bio: "Este persoana care ține lucrurile organizate: de la întâlniri și minute până la documentele care circulă în interiorul și în afara platformei."
    achievements_title: "Rol & Responsabilități"
    achievements:
      - "Organizarea documentelor și minutelor"
      - "Gestionarea fluxului de informații"
