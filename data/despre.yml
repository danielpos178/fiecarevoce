hero:
  title: "Despre Noi"
  subtitle: "Descoperă povestea din spatele platformei și cunoaște echipa care face totul posibil."
  image: "/images/echipa/echipa-fiecare-voce.webp"

cine_suntem:
  title: "Cine suntem?"
  paragraphs:
    - "La început, Fiecare Voce a fost un proiect construit în jurul ideii de a crea un spațiu în care elevii să poată vorbi liber despre lucrurile care îi afectează. În timp, ne-am conturat direcția și am ales să ne concentrăm tot mai mult pe educație și pe mediul preuniversitar din România. Astăzi, Fiecare Voce este o platformă independentă care susține și publică opiniile elevilor, fără filtre, și aduce în atenție problemele care afectează educația românească. Credem că problemele elevilor trebuie prezentate public, documentate și aduse în fața celor care pot contribui la schimbarea lor."
    - "De aproximativ un an, redactăm și transmitem documente către Ministerul Educației și alte instituții, prin care formulăm propuneri, semnalăm probleme și susținem nevoile elevilor. În același timp, publicăm articole și materiale educaționale prin care explicăm și analizăm problemele din sistemul de învățământ."
    - "Tot ceea ce facem este construit alături de o echipă de peste 30 de elevi din întreaga țară uniți de aceeași dorință, de a avea o voce, să fie ascultați și să contribuie la o educație mai bună pentru că fiecare voce contează și pentru că schimbarea începe atunci când alegem să o folosim."

secretariat:
  title: "Secretariat"
  description: "Secretariatul este echipa care coordonează activitatea Fiecare Voce și contribuie la stabilirea direcției în care mergem. Este format din fondatori, coordonatorul principal, secretar, directorul de PR și coordonatorul de activitate al membrilor."

social_media:
  title: "Echipa de Social Media"
  description: "Dincolo de Secretariat, Fiecare Voce are o echipă de social media care lucrează în grafică, redacție și web development și care transformă ideile noastre în materiale pe care le puteți vedea, citi și folosi."

