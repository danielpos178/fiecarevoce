structure:
  title: "Structura Internă și ROF"
  subtitle: "Cum funcționăm și cum suntem organizați"
  description: "Asociația Fiecare Voce este guvernată de un set clar de reguli și proceduri, detaliate în Regulamentul de Organizare și Funcționare (ROF). Structura noastră este formată din Adunarea Generală, Consiliul Director și departamente specializate care se asigură de implementarea eficientă a tuturor proiectelor noastre comunitare."
  rof:
    text: "Citește Regulamentul (ROF)"
